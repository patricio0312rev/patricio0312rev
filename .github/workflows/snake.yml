name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake.svg (dark mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: patricio0312rev
          github_token: ${{ secrets.SNAKE_GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark

      - name: Generate snake.svg (light mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: patricio0312rev
          github_token: ${{ secrets.SNAKE_GITHUB_TOKEN }}
          outputs: |
            dist/snake-light.svg?palette=github-light

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
