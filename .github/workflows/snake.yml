name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate snake.svg (dark mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: patricio0312rev
          github_token: ${{ secrets.SNAKE_GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark

      - name: Generate snake.svg (light mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: patricio0312rev
          github_token: ${{ secrets.SNAKE_GITHUB_TOKEN }}
          outputs: |
            dist/snake-light.svg?palette=github-light

      - name: Publish output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git checkout -B output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: update contribution snake"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin output
